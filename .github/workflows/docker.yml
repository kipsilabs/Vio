name: Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, apiv2]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also tag and push as :latest (default false)"
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Published build numbers belong to this workflow. Keep it as the sole owner
  # of the sequence; raise the offset if the workflow counter ever loses
  # continuity so a new build remains greater than every existing build tag.
  BUILD_NUMBER_OFFSET: 0
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*

jobs:
  prepare:
    name: Prepare build identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build_number: ${{ steps.identity.outputs.build_number }}
      built_at: ${{ steps.identity.outputs.built_at }}
      image_version: ${{ steps.identity.outputs.image_version }}
      is_stable: ${{ steps.identity.outputs.is_stable }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'apiv2'))
    steps:
      - name: Resolve build identity
        id: identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "::error::Repository default branch is unavailable."
            exit 1
          fi

          build_number=""
          image_version="${GITHUB_SHA::7}"
          is_stable="false"
          if [[ "$EVENT_NAME" == "release" ]]; then
            if (( ${#RELEASE_TAG} > 128 )); then
              echo "::error::Release tag exceeds Docker 128-character limit."
              exit 1
            fi
            core='(0|[1-9][0-9]*)'
            pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            semver_regex="^v${core}\.${core}\.${core}(-${pre}(\.${pre})*)?$"
            if [[ ! "$RELEASE_TAG" =~ $semver_regex ]]; then
              echo "::error::Release tag must be valid SemVer vMAJOR.MINOR.PATCH[-PRERELEASE] without build metadata."
              exit 1
            fi
            if [[ "$RELEASE_TAG" != *-* && "$PRERELEASE" != "true" ]]; then
              is_stable="true"
            fi
            image_version="$RELEASE_TAG"
          elif [[ "$TARGET_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            build_number=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
            if (( build_number <= 0 )); then
              echo "::error::Build number must be positive."
              exit 1
            fi
            image_version="build-${build_number}"
          fi

          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image_version=${image_version}" >> "$GITHUB_OUTPUT"
          echo "is_stable=${is_stable}" >> "$GITHUB_OUTPUT"

      - name: Checkout for manual frontend build
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up pnpm for manual frontend build
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node.js for manual frontend build
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend for manual builds
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Upload frontend bundle for manual builds
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist
          retention-days: 1

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare platform slug and lowercase image name
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Download validated frontend bundle
        uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: frontend-dist-${{ github.event.workflow_run.head_sha || github.sha }}
          path: web/dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download frontend bundle for manual builds
        uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/Silo-Server/silo-plugin-sdk => /' go.mod; then
            echo "go.mod contains a machine-local silo-plugin-sdk replace."
            exit 1
          fi

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Go build cache
        uses: actions/cache@v4
        # Cache-service flakiness must not fail the image build.
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/go-build-cache
          key: go-build-${{ env.PLATFORM_PAIR }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-${{ env.PLATFORM_PAIR }}-${{ hashFiles('go.sum') }}-
            go-build-${{ env.PLATFORM_PAIR }}-

      - name: Inject and persist Go build cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        # The inject round-trip can time out waiting for the arm64 BuildKit
        # builder; the cache is an optimization, so retry once and otherwise
        # degrade to a full uncached build instead of failing the image.
        continue-on-error: true
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/buildkit-scratch
          cache-map: |
            {
              "${{ runner.temp }}/go-build-cache": "/root/.cache/go-build"
            }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.built_at }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          # Attestations are never read by the digest + manifest-merge flow, so skip
          # generating them: cheaper builds and a smaller cache-to upload.
          provenance: false
          sbom: false
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            frontend_dist=./web/dist
          build-args: |
            BUILD_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}
            BUILD_DIRTY=false
            BUILD_NUMBER=${{ needs.prepare.outputs.build_number }}
            BUILD_DATE=${{ needs.prepare.outputs.built_at }}
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=docker-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    permissions:
      packages: write

    steps:
      - name: Prepare lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}
          tags: |
            type=raw,value=dev,enable=${{ github.event_name != 'release' && (github.event.workflow_run.head_branch == github.event.repository.default_branch || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_stable == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_latest == true) }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') }}
            type=raw,value=build-${{ needs.prepare.outputs.build_number }},enable=${{ github.event_name != 'release' && (github.event.workflow_run.head_branch == github.event.repository.default_branch || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) && needs.prepare.outputs.build_number != '' }}
            type=raw,value=apiv2,enable=${{ github.event.workflow_run.head_branch == 'apiv2' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'apiv2') }}
            type=raw,value=${{ (github.event.workflow_run.head_sha || github.sha) }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_LC}@sha256:%s " *)

      - name: Inspect manifest list
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          EVENT_NAME: ${{ github.event_name }}
          IS_STABLE: ${{ needs.prepare.outputs.is_stable }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:${{ github.event.workflow_run.head_sha || github.sha }}"
          if [[ -n "${BUILD_NUMBER}" ]]; then
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:build-${BUILD_NUMBER}"
          fi
          if [[ "${EVENT_NAME}" != "release" && "${TARGET_BRANCH}" == "${DEFAULT_BRANCH}" ]]; then
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:dev"
          fi
          if [[ "${IS_STABLE}" == "true" || "${PUBLISH_LATEST}" == "true" ]]; then
            docker buildx imagetools inspect "${REGISTRY}/${IMAGE_LC}:latest"
          fi
