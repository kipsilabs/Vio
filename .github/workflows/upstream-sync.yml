name: Upstream synchronization

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vio main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Silo-Server/silo-server.git
          git fetch --prune upstream main
          git fetch --prune origin main

      - name: Select synchronization branch
        id: sync-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reuse any open sync PR, including the legacy per-run branch used by PR 419.
          branch=$(gh pr list --repo "$GH_REPO" --state open --base main --limit 100 \
            --json headRefName --jq '.[] | select(.headRefName == "automation/upstream-sync" or (.headRefName | startswith("upstream-sync-"))) | .headRefName' | head -n 1)
          branch=${branch:-automation/upstream-sync}
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git fetch --prune origin "$branch:$branch" || true

      - name: Check for upstream commits
        id: upstream
        run: |
          count=$(git rev-list --count origin/main..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo 'No upstream commits remain; synchronization is complete.'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare synchronization branch
        if: steps.upstream.outputs.needed == 'true'
        env:
          BRANCH: ${{ steps.sync-branch.outputs.branch }}
        run: |
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-ff --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi
          git merge --no-ff --no-edit upstream/main

      - name: Verify fork invariants
        if: steps.upstream.outputs.needed == 'true'
        run: make verify-fork-invariants

      - name: Verify v2 contract
        if: steps.upstream.outputs.needed == 'true'
        run: make verify-apiv2-contract BASE_REF=origin/main

      - name: Push synchronization branch
        if: steps.upstream.outputs.needed == 'true'
        env:
          BRANCH: ${{ steps.sync-branch.outputs.branch }}
        run: git push --force-with-lease origin HEAD:"$BRANCH"

      - name: Create or update synchronization pull request
        if: steps.upstream.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          upstream_sha="$(git rev-parse upstream/main)"
          upstream_count="$(git rev-list --count origin/main..upstream/main)"
          short_sha="${upstream_sha:0:12}"
          title="chore: sync upstream main (${short_sha}, ${upstream_count} commit$( [ "$upstream_count" = 1 ] || printf 's' ))"
          body=$(cat <<EOF
          ## Upstream synchronization

          This pull request tracks the stable \\`automation/upstream-sync\\` branch and merges \\`Silo-Server/silo-server:main\\` into Vio with a non-fast-forward merge.

          - Upstream SHA: \\`$upstream_sha\\`
          - Upstream commits ahead of Vio main: \\`$upstream_count\\`
          - Conflict handling: conflicts stop the workflow and require manual resolution.
          - Auto-merge: intentionally not enabled.

          Checks run by the synchronization workflow:
          - \\`make verify-fork-invariants\\`
          - \\`make verify-apiv2-contract BASE_REF=origin/main\\`
          EOF
          )
          pr_number=$(gh pr list --repo "$GH_REPO" --state open --head automation/upstream-sync --base main --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GH_REPO" --title "$title" --body "$body"
          else
            gh pr create --repo "$GH_REPO" --base main --head automation/upstream-sync --title "$title" --body "$body"
          fi
