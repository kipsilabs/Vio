name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Integration branch for the API v2 program (#135). Stacked PRs merge
      # here first; the merge commits need the same gate as main.
      - apiv2
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*
  # Pinned so a lint gate cannot change its mind between two runs of the same
  # commit. Built from source below rather than downloaded: a released binary
  # refuses to run against a Go version newer than the one it was built with,
  # and go.mod tracks Go closely enough that this repo is regularly ahead.
  GOLANGCI_LINT_VERSION: v2.12.2

# The default token is read-write. Nothing here needs to write, and a token
# that cannot push is one fewer thing a compromised dependency can reach.
permissions:
  contents: read

# The Go-side work is split across three parallel jobs: build+verify+test,
# lint of the lines a branch touched, and the full-tree router-recovery lint.
# They recompile the same tree in different ways and each dominated the old
# single-job run, so running them side by side costs one tree build instead
# of three in sequence. Every check runs unchanged; only the scheduling
# differs. docker.yml triggers on this workflow's success for main/apiv2, so
# the workflow name and its overall success semantics must not change.
jobs:
  # The Go gate is three jobs so that lint, the contract checks, and the test
  # suite run side by side; each one alone is shorter than the serial job they
  # replace. They share the composite setup action under .github/actions.
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The v2 contract-diff gate fetches the PR's base and semantic-diffs
          # against it, so the full history has to be present.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/Silo-Server/silo-plugin-sdk => /' go.mod; then
            echo "go.mod contains a machine-local silo-plugin-sdk replace."
            exit 1
          fi

      - name: Validate SDK resolves from the module graph
        env:
          GOWORK: off
        run: |
          sdk_module_json="$(mktemp)"
          go list -m -json github.com/Silo-Server/silo-plugin-sdk > "$sdk_module_json"
          if grep -q '"Main": true' "$sdk_module_json"; then
            echo "silo-plugin-sdk resolved from the local workspace instead of go.mod."
            cat "$sdk_module_json"
            exit 1
          fi

      # Fork invariants: fail loudly when an upstream merge (or local edit)
      # breaks a deliberate Vio divergence.
      - name: Verify fork invariants
        run: make verify-fork-invariants

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt is required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Built from source (see GOLANGCI_LINT_VERSION) but only once per
      # version: the binary is cached, and so is the analysis cache that lets
      # a run over an unchanged package skip the type-check and the linters.
      # Without the second cache both lint steps below analyzed all of ./...
      # from scratch on every run, which was most of the old job's time.
      - name: Restore the golangci-lint binary
        id: golangci-lint-binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-binary-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}

      - name: Install golangci-lint
        if: steps.golangci-lint-binary.outputs.cache-hit != 'true'
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Restore the golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      # Scoped to the lines this branch touched. The repo does not pass a full
      # golangci-lint run today — there are a few hundred pre-existing findings,
      # which is why the Go half of `make lint` has never been enforced — and
      # blocking every PR on a cleanup nobody has done would just get the gate
      # removed again. New and changed lines have to be clean, so the count only
      # falls from here.
      - name: Lint changed lines
        env:
          # A PR carries its target branch; a push to main compares against
          # main's own history, which leaves the merge base at HEAD and lints
          # nothing new. Read through the environment rather than interpolated
          # into the script.
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          golangci-lint run --new-from-merge-base="origin/${BASE_REF}" ./...

      # The inventory's lint rule (recovering a router from a handler) has to
      # hold over the whole tree, not only the lines a branch touched: an old
      # line folded in by a rebase is as much of a hole as a new one.
      - name: Lint router recovery full-tree
        run: make lint-router-recovery

  go-verify:
    name: Go contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The contract diff compares against the PR's merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: verify

      # A manifest change that does not regenerate leaves every client reading
      # stale keys, which the contract exists to prevent.
      - name: Verify settings bindings are current
        run: make verify-settings-bindings

      # The server defines the playback protocol and the clients prove
      # conformance against these fixtures. A contract change that does not
      # regenerate leaves every client testing against a stale body, so the
      # drift surfaces as a playback bug on three platforms rather than as a
      # failure here.
      - name: Verify playback protocol fixtures are current
        run: make verify-playback-fixtures

      # The API v2 migration needs every legacy native route accounted for
      # before anything is ported. The generator reads registration source, so
      # a route hidden behind optional dependency wiring still has to appear,
      # and a registration it cannot follow fails here rather than shrinking
      # the inventory in silence.
      - name: Verify the legacy native route inventory is current
        run: make verify-route-inventory

      # Every inventoried route needs a migration decision before v2 work
      # ports it. The ledger is schema-checked and reconciled against the
      # inventory one-to-one, so a new route without a ledger entry, or a
      # stale entry for a removed route, fails here.
      - name: Verify the v2 migration ledger covers the route inventory
        run: make verify-migration-ledger

      # Every tier-1 row in a migration wave needs an executable scenario
      # catalog before that wave's first section PR. The catalogs are
      # schema-checked and reconciled against the ledger here; the executor
      # runs their public subset under make test-go and the rest locally
      # against an empty database named by SILO_SCENARIO_DATABASE_URL (a
      # dedicated variable: the executor truncates, so it never shares
      # SILO_TEST_DATABASE_URL with the other DB-gated packages).
      - name: Verify the tier-1 scenario catalogs cover their waves
        run: make verify-scenario-catalogs

      # The executor's offline run-vs-skip decision reads a committed list of
      # the routes the no-database API router registers, because the sealed
      # router cannot be walked from outside internal/api. This regenerates
      # that list from the real router and fails if the committed file drifted.
      - name: Verify the offline route set matches the API router
        run: make verify-offline-routes

      # The v2 OpenAPI artifact is rendered from the Go registries and the
      # binary serves the committed bytes, so a registration change that does
      # not regenerate leaves clients reading a contract the server no longer
      # matches. This byte-compares a fresh generation.
      - name: Verify the v2 OpenAPI artifact is current
        run: make verify-apiv2-openapi

      # Spec lint and the semantic diff against the PR's base. A breaking
      # change fails unless contracts/api/v2/breaking-approvals.json names
      # that exact operation, rule and fingerprint; after the LOCKED marker
      # nothing is approvable. On a push to main the base is main itself, so
      # both documents are identical and the diff tool compares nothing (an
      # approval a just-merged PR carried is not stale there); the lint still
      # runs. The base is read through the environment, as the lint step
      # does, never interpolated into the script.
      - name: Verify the v2 contract diff and spec lint
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          make verify-apiv2-contract BASE_REF="origin/${BASE_REF}"

      # The v2 fixtures are generated through the real router and every body
      # is validated against the committed OpenAPI schema its index names, so
      # a client testing against them tests against what the server sends.
      - name: Verify the v2 contract fixtures are current and valid
        run: make verify-apiv2-fixtures

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    services:
      watch-party-postgres:
        # pgvector image, not stock postgres: testdb migrates the full
        # schema, which needs the vector extension (same image as
        # docker-compose.yml and the go-db-pins job).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The name must contain "test": testdb.SetupPackage clones this
          # database per test package and refuses a non-test base name.
          POSTGRES_DB: watch_party_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watch_party_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: test

      # Runs the settings-contract gate among everything else: the embedded
      # manifest must parse, satisfy its own schema, hold every structural
      # invariant, and agree with the live settings registry on keys and
      # defaults. Without this job those tests exist but never run.
      - name: Test Watch Party coordination against Postgres
        env:
          SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/watch_party_test?sslmode=disable
        run: go test -race -count=1 ./internal/watchtogether/

      - name: Test history import cancellation and profile authorization against Postgres
        env:
          SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/watch_party_test?sslmode=disable
        run: go test -race -count=1 -run '^(TestHistoryImportCancellation.*|TestQueue.*|TestHistoryImportV1ProfileAuthorization)$' ./migrations/ ./internal/historyimport/ ./internal/api/handlers/

      # 20260925144545 moves marker claims between rows that share a payload
      # while the payload index still exists. The replay seeds a winner-first
      # pair and a NULL-key row sharing a keyed payload; either alone failed
      # the original. make test-go has no database, so only this step runs it.
      - name: Test the marker claim migration against Postgres
        env:
          SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/watch_party_test?sslmode=disable
        run: go test -race -count=1 -run '^TestMarkerContributionClaimsByTargetMigrationPostgres$' ./migrations/

      # Compiles every package on the way, so there is no separate build step.
      - name: Test
        run: make test-go

  # DB-backed tests that need the full pgvector schema migrated before they
  # run. They used to sit in the full-tree lint job, which provides no Postgres
  # service and no SILO_TEST_DATABASE_URL: every one skipped while still paying
  # its compile time on the critical path. They run here instead, in their own
  # database job, in parallel with the rest of the gate.
  go-integration:
    name: Go integration
    runs-on: ubuntu-latest
    services:
      integration-postgres:
        # pgvector, not stock postgres: the migrations and the taste-cluster
        # tests need the vector extension.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d silo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/silo_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: integration

      # The tests below read the migrated base schema (media_items, admin_jobs,
      # ...), so the database is migrated once before they run.
      - name: Migrate the test database
        run: DATABASE_URL="$SILO_TEST_DATABASE_URL" SECRET_KEY="$(openssl rand -base64 48)" go run ./cmd/silo/ --migrate-only

      - name: Test image cache cleanup resumption against Postgres
        run: go test -race -count=1 -run '^(TestImageCacheCleanup|TestRequeuedImageCacheCleanup|TestJobOutcomeIsRecorded)' ./internal/adminjob/

      - name: Test taste cluster replacement against Postgres
        run: go test -race -count=1 -run '^TestUpsertTasteClusters.*Postgres$' ./internal/recommendations/

      - name: Test Jellyfin detail preferences against Postgres
        run: go test -race -count=1 -run '^TestCompatDetailServiceResolvesViewerSubtitleDefaultsPostgres$' ./cmd/silo/

  lint:
    name: Go lint (changed lines)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # golangci-lint needs the merge base to tell this branch's lines from
          # the ones it inherited.
          fetch-depth: 0
          persist-credentials: false

      # The lint jobs typecheck the whole tree, so cgo packages need libvips
      # headers even though neither lint step links anything.
      - name: Install libvips
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # cmd/silo embeds the built frontend; the stub satisfies the compiler.
      - name: Stub the embedded frontend bundle
        run: make embed-stub

      # The toolchain the binary was built with matters: a golangci-lint
      # binary refuses a host Go newer than the one it was built against, so
      # the cache key carries the Go version alongside the pinned release.
      - name: Resolve Go version
        id: gover
        run: echo "v=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      # Built once per version and reused. `go install` re-downloads the
      # module graph on every run otherwise; setup-go's module cache still
      # serves the download when the binary cache misses.
      - name: Restore golangci-lint
        id: golangci
        uses: actions/cache@v4
        with:
          path: ~/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.gover.outputs.v }}

      - name: Install golangci-lint
        if: steps.golangci.outputs.cache-hit != 'true'
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          mkdir -p "$HOME/bin"
          mv "$(go env GOPATH)/bin/golangci-lint" "$HOME/bin/golangci-lint"

      - name: Put golangci-lint on PATH
        run: echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Lint changed lines
        env:
          # A PR carries its target branch; a push to main compares against
          # main's own history, which leaves the merge base at HEAD and lints
          # nothing new. Read through the environment rather than interpolated
          # into the script.
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          golangci-lint run --timeout=20m --new-from-merge-base="origin/${BASE_REF}" ./...

  # The inventory's lint rule (recovering a router from a handler) has to hold
  # over the whole tree, not only the lines a branch touched: an old line
  # folded in by a rebase is as much of a hole as a new one. It runs as its own
  # lane rather than behind the changed-lines lint; the build and analysis
  # caches below keep the full-tree pass cheap.
  lint-router-recovery:
    name: Go lint (router recovery, full tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The composite action installs libvips, sets up the Go toolchain, stubs
      # the embedded frontend bundle, and restores a per-commit build and module
      # cache. That last part is what pre-warms the build cache the full-tree
      # type-check reuses; a bare setup-go here restored only its own stale
      # go.sum-keyed cache instead.
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint-router-recovery

      # The toolchain the binary was built with matters: a golangci-lint
      # binary refuses a host Go newer than the one it was built against, so
      # the cache key carries the Go version alongside the pinned release.
      - name: Resolve Go version
        id: gover
        run: echo "v=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Restore golangci-lint
        id: golangci
        uses: actions/cache@v4
        with:
          path: ~/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.gover.outputs.v }}

      - name: Install golangci-lint
        if: steps.golangci.outputs.cache-hit != 'true'
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          mkdir -p "$HOME/bin"
          mv "$(go env GOPATH)/bin/golangci-lint" "$HOME/bin/golangci-lint"

      - name: Put golangci-lint on PATH
        run: echo "$HOME/bin" >> "$GITHUB_PATH"

      # golangci-lint caches per-package analysis and facts. Without restoring
      # that cache this job re-analyzed the whole tree from scratch every run
      # (~14 min), while the go-lint job runs the identical command over a
      # restored cache in under a minute. The cache is saved under a
      # job-specific key and restored from the shared prefix, so it also picks
      # up the cache the go-lint job writes.
      - name: Restore the golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-router-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-cache-router-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-
            golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Lint router recovery full-tree
        run: make lint-router-recovery

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The pnpm version comes from web/package.json's packageManager field —
      # there is no package.json at the repo root, and `defaults.run` does not
      # apply to an action's own inputs.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck and build
        run: pnpm run build

      - name: Upload frontend bundle for image builds
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

      # The generated web binding is compared after prettier, so this half of
      # the bindings check lives here rather than in the Go job, which has no
      # pnpm. It needs Go to run the generator.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the generated web settings binding is current
        working-directory: .
        run: make verify-settings-bindings-web

      # The web v2 contract types are generated from the committed OpenAPI
      # artifact with the pinned openapi-typescript; this byte-compares a
      # fresh generation so the typed request boundary never drifts from the
      # spec the server serves.
      - name: Verify the generated web v2 contract types are current
        working-directory: .
        run: make verify-apiv2-web-types

      - name: Verify no local paths leaked into committed docs
        working-directory: .
        run: make verify-local-paths

  web-test:
    name: Web test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Includes the appearance-cache ownership tests, which are the regression
      # guard for cross-account leaks in the localStorage warm start. The
      # suite is split across two runners; vitest assigns files to a shard
      # deterministically, so every file runs exactly once.
      - name: Test
        run: make test-web WEBTEST_ARGS="--shard=${{ matrix.shard }}/2"
