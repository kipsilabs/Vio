name: Set up Go for this repository
description: >-
  Installs libvips, the Go toolchain from go.mod, a per-commit build and module
  cache, and the stub frontend bundle that cmd/silo embeds.

inputs:
  cache-name:
    description: >-
      Distinguishes the build cache of one job from another's. Jobs compile
      different things (a lint job type-checks, a test job builds test
      binaries), so each keeps a cache that matches its own work.
    required: true

runs:
  using: composite
  steps:
    # github.com/h2non/bimg binds libvips through cgo and pkg-config, so
    # nothing under ./... compiles without the headers. The Dockerfile
    # installs the same package in its build stage.
    #
    # On a GitHub-hosted runner the .deb files are cached per runner image, so
    # a warm cache installs them offline: no apt-get update and no downloads.
    # The private runner image already carries the headers, so pkg-config
    # short-circuits there.
    - name: Read the libvips cache key
      if: runner.environment == 'github-hosted'
      id: libvips-cache-key
      shell: bash
      run: echo "key=libvips-dev-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

    - name: Restore the libvips packages
      if: runner.environment == 'github-hosted'
      id: libvips-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/libvips-debs
        key: ${{ steps.libvips-cache-key.outputs.key }}

    - name: Install libvips
      shell: bash
      run: |
        # The disposable private runner image already includes these headers.
        if pkg-config --exists vips; then
          exit 0
        fi
        # libvips and its dependencies use the runner's official Ubuntu sources.
        # The Acquire options bound a stalled mirror: without them apt-get
        # update can sit on a slow connection for the whole job (seen at 22
        # minutes). Languages=none skips the translation indexes.
        test -f /etc/apt/sources.list.d/ubuntu.sources
        apt_options=(
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::sourceparts=-
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o Acquire::ForceIPv4=true
          -o Acquire::Languages=none
        )
        if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
          mkdir -p "$RUNNER_TEMP/libvips-debs"
          apt_options+=(-o "Dir::Cache::archives=$RUNNER_TEMP/libvips-debs")
          # The restore has no fallback keys, so packages are present only when
          # they were saved on this runner image. apt then installs them as
          # local files without touching the network.
          debs=("$RUNNER_TEMP"/libvips-debs/*.deb)
          if [ -e "${debs[0]}" ]; then
            echo "installing libvips from the cache"
            if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends --no-download "${debs[@]}"; then
              exit 0
            fi
          fi
        fi
        # The runner image ships package lists, so try the install before
        # paying for an index update. This is the step that stalled; a stale or
        # missing list falls through to the update below.
        echo "installing libvips"
        if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev; then
          exit 0
        fi
        echo "updating package lists and retrying"
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev

    # Saved only on a push to main, where the cache is shared with PRs; the
    # key is the runner image, not the commit, so one entry serves every run
    # on that image.
    - name: Save the libvips packages
      if: runner.environment == 'github-hosted' && github.event_name != 'pull_request' && steps.libvips-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/libvips-debs
        key: ${{ steps.libvips-cache.outputs.cache-primary-key }}

    # setup-go's own cache is keyed on go.sum alone and written only on a
    # miss, so between dependency bumps every run restored a build cache
    # from weeks ago and recompiled the tree. The cache below is keyed on the
    # commit and restored by prefix, so each run starts from the newest
    # cache any earlier run saved.
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: false

    - name: Read the Go version
      id: go
      shell: bash
      run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

    # A PR run restores the build and module cache main last saved but does not
    # save one. Each lane's cache is 0.6-1.4 GB, and saving a per-PR copy on
    # every run filled GitHub's 10 GB budget, which then evicted the small
    # caches (the golangci-lint analysis cache) that make the lint lanes fast.
    # Only a push to main saves, and the prune job keeps the newest per lane.
    - name: Restore the Go build and module cache
      if: runner.environment == 'github-hosted' && github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ inputs.cache-name }}-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ inputs.cache-name }}-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-
          go-${{ inputs.cache-name }}-${{ runner.os }}-${{ steps.go.outputs.version }}-

    - name: Restore and save the Go build and module cache
      if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ inputs.cache-name }}-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-${{ inputs.cache-name }}-${{ runner.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}-
          go-${{ inputs.cache-name }}-${{ runner.os }}-${{ steps.go.outputs.version }}-

    # cmd/silo embeds the built frontend, so nothing under ./... compiles
    # without web/dist. The Go jobs never serve it, so a placeholder is
    # enough; the Docker workflow builds the real bundle.
    - name: Stub the embedded frontend bundle
      shell: bash
      run: make embed-stub
